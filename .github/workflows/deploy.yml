name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Custom domain (savingsolutionsinsurance.com) serves from the root — no base path
      SITE_URL: https://savingsolutionsinsurance.com
      # GoHighLevel inbound-webhook workflow trigger — website quote + form leads
      NEXT_PUBLIC_INTAKE_WEBHOOK: https://services.leadconnectorhq.com/hooks/Wl6LsyVGEfoktjHed3ZN/webhook-trigger/5eb6d985-fe9d-4da9-abfa-b70351c14866
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Google Fonts download occasionally flakes on the runner — retry once
      - run: npm run build || (sleep 20 && npm run build)
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
